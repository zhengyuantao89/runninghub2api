services:
  runninghub2api:
    build: .
    image: runninghub2api:latest
    container_name: runninghub2api
    restart: unless-stopped
    ports:
      - "${RH2API_HOST_PORT:-8088}:8088"
    env_file:
      - .env
    environment:
      RH2API_ADDR: ":8088"
      RH2API_DATA_DIR: /app/data
      RH2API_WEB_DIR: /app/web/dist
    volumes:
      - rh2api_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  rh2api_data:
